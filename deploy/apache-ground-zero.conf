# Ground Zero — osservatorio educativo sugli effetti delle armi nucleari.
# Sito statico (Vite) in /var/www/html/ground-zero, servito sotto /ground-zero/.
# Installazione: conf-available/ground-zero.conf + a2enconf (vedi installa.sh).
# Su Balthasar AllowOverride e' None: le regole stanno qui.

<Directory /var/www/html/ground-zero>
    Options -Indexes
    Require all granted
    <IfModule mod_headers.c>
        # La pagina e la versione si ricontrollano sempre; gli asset hanno l'impronta nel nome.
        <FilesMatch "^(index\.html|version\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</Directory>

<Directory /var/www/html/ground-zero/assets>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

<Directory /var/www/html/ground-zero/media>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=604800"
    </IfModule>
</Directory>

# /ground-zero (senza barra) → /ground-zero/
RedirectMatch 301 ^/ground-zero$ /ground-zero/
